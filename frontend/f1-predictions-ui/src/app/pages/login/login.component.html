<div class="auth-page">
    <!-- Racing stripe decoration -->
    <div class="racing-stripes">
        <div class="stripe stripe-1"></div>
        <div class="stripe stripe-2"></div>
        <div class="stripe stripe-3"></div>
    </div>

    <!-- Checkered flag pattern overlay -->
    <div class="checkered-overlay"></div>

    <div class="auth-container">
        <!-- F1 Logo Header -->
        <div class="auth-header">
            <div class="logo-wrapper">
                <div class="f1-badge">
                    <span class="f1-text">F1</span>
                    <span class="predictions-text">PREDICTIONS</span>
                </div>
            </div>
            <h1>Welcome Back</h1>
            <p class="subtitle">Sign in to access your predictions</p>
        </div>

        <!-- Error Message -->
        @if (errorMessage()) {
        <div class="alert alert-error">
            <div class="alert-icon">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                </svg>
            </div>
            <span>{{ errorMessage() }}</span>
        </div>
        }

        <!-- Login Form -->
        <form class="auth-form" (ngSubmit)="onSubmit()">
            <div class="input-group">
                <label for="phone">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" />
                    </svg>
                    Phone Number
                </label>
                <input type="tel" id="phone" name="phone" [(ngModel)]="phone" placeholder="+961 XX XXX XXX"
                    autocomplete="tel" required />
            </div>

            <div class="input-group">
                <label for="password">
                    <svg class="input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                    </svg>
                    Password
                </label>
                <input type="password" id="password" name="password" [(ngModel)]="password"
                    placeholder="Enter your password" autocomplete="current-password" required />
            </div>

            <button type="submit" class="btn-race" [disabled]="isLoading()">
                @if (isLoading()) {
                <div class="loading-spinner"></div>
                <span>Starting Engine...</span>
                } @else {
                <span>Sign In</span>
                <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 7l5 5m0 0l-5 5m5-5H6" />
                </svg>
                }
            </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
            <span>New to F1 Predictions?</span>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
            <a routerLink="/signup" class="btn-secondary">Create Account</a>
        </div>
    </div>

    <!-- Bottom decoration -->
    <div class="finish-line"></div>
</div>
